<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPass Pro</title>
    <!-- Libreria per generare i codici a barre a linee nere -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <!-- Libreria per la scansione con fotocamera -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            --text-color: #f8fafc;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            --success-color: #22c55e;
            --danger-color: #f43f5e;
            --radius: 20px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 480px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); padding: 16px 20px; border-radius: var(--radius); border: 1px solid rgba(255,255,255,0.05); }
        h1 { font-size: 1.4rem; font-weight: 800; background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .btn-add { background: var(--accent-gradient); color: #0f172a; border: none; padding: 10px 18px; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 0.9rem; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); transition: transform 0.2s; }
        .btn-add:active { transform: scale(0.95); }

        .cards-grid { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; }
        
        .pass-card { background: var(--card-bg); padding: 20px; border-radius: var(--radius); display: flex; justify-content: space-between; align-items: center; cursor: pointer; box-shadow: 0 8px 20px -4px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.06); border-left: 6px solid #38bdf8; transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .pass-card:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -4px rgba(56, 189, 248, 0.15); }
        .pass-card:active { transform: scale(0.98); }
        
        .pass-info h3 { font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; color: #ffffff; }
        .pass-info p { font-size: 0.85rem; color: #94a3b8; font-family: monospace; letter-spacing: 1px; }
        
        .card-actions-row { display: flex; gap: 8px; margin-top: 12px; }
        .btn-mini-maps { background: rgba(51, 65, 85, 0.8); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.2); padding: 6px 12px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: background 0.2s; }
        .btn-mini-maps:hover { background: rgba(56, 189, 248, 0.15); }

        .btn-delete { background: rgba(244, 63, 94, 0.1); border: 1px solid rgba(244, 63, 94, 0.2); color: #f43f5e; border-radius: 12px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; }
        .btn-delete:hover { background: rgba(244, 63, 94, 0.2); }

        /* Modal Aggiunta */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(9, 13, 22, 0.85); backdrop-filter: blur(8px); justify-content: center; align-items: center; padding: 20px; z-index: 100; animation: fadeIn 0.2s ease; }
        .modal-content { background: #131c31; width: 100%; max-width: 400px; padding: 28px; border-radius: 24px; display: flex; flex-direction: column; gap: 16px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .modal-content h2 { font-size: 1.3rem; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
        
        input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid #334155; background: #090d16; color: white; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #38bdf8; }
        
        .btn-scan-cam { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); color: #ffffff; border: none; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: 0.95rem; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3); }
        
        .modal-buttons { display: flex; gap: 10px; margin-top: 8px; }
        .btn { flex: 1; padding: 14px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; font-size: 0.95rem; }
        .btn-save { background: var(--accent-gradient); color: #0f172a; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); }
        .btn-cancel { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }

        /* Schermata Scanner Fotocamera */
        #scannerModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 300; flex-direction: column; justify-content: space-between; align-items: center; padding: 40px 20px; }
        #videoContainer { width: 100%; max-width: 400px; height: 350px; position: relative; border-radius: 20px; overflow: hidden; border: 2px solid #38bdf8; box-shadow: 0 0 30px rgba(56,189,248,0.3); }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scanner-instruction { color: white; text-align: center; font-size: 1rem; font-weight: 500; }

        /* Fullscreen Barcode per la Cassa */
        .fullscreen-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; color: #0f172a; z-index: 200; flex-direction: column; justify-content: space-between; align-items: center; padding: 50px 20px; text-align: center; animation: fadeIn 0.2s ease; }
        .fullscreen-view h2 { font-size: 2.2rem; font-weight: 800; margin-bottom: 6px; color: #0f172a; }
        .barcode-box { background: #ffffff; padding: 30px 20px; border-radius: 20px; width: 100%; max-width: 440px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; }
        svg#barcode { width: 100%; max-width: 380px; height: auto; }
        .close-full { background: #0f172a; color: white; border: none; width: 100%; max-width: 320px; padding: 16px; border-radius: 16px; font-size: 1.1rem; font-weight: bold; cursor: pointer; box-shadow: 0 8px 20px rgba(15,23,42,0.3); }
        
        .empty-state { text-align: center; color: #64748b; margin-top: 60px; font-size: 0.95rem; line-height: 1.6; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SmartPass Pro</h1>
            <button class="btn-add" onclick="openModal()">+ Nuova</button>
        </header>

        <div id="cardsList" class="cards-grid"></div>
        <div id="emptyState" class="empty-state" style="display: none;">Nessuna tessera salvata.<br>Tocca "+ Nuova" in alto per iniziare.</div>
    </div>

    <!-- Modal Aggiunta -->
    <div id="cardModal" class="modal">
        <div class="modal-content">
            <h2>Nuova Tessera</h2>
            <input type="text" id="passName" placeholder="Nome Negozio (es. Conad, Coop)">
            
            <button type="button" class="btn-scan-cam" onclick="startCameraScanner()">
                📷 Inquadra con Fotocamera
            </button>
            
            <input type="text" id="passCode" placeholder="Codice numerico (o scansionato)">

            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeModal()">Annulla</button>
                <button class="btn btn-save" onclick="savePass()">Salva</button>
            </div>
        </div>
    </div>

    <!-- Scanner Fotocamera Dedicato -->
    <div id="scannerModal">
        <div class="scanner-instruction">Inquadra il codice a barre della tessera</div>
        <div id="videoContainer">
            <video id="cameraPreview" autoplay playsinline></video>
        </div>
        <button class="btn btn-cancel" style="width: 100%; max-width: 300px; padding: 14px;" onclick="stopCameraScanner()">Annulla</button>
    </div>

    <!-- Vista Schermo Intero per la Cassa -->
    <div id="fullscreenView" class="fullscreen-view">
        <div>
            <h2 id="fullTitle">Negozio</h2>
            <p style="color: #64748b; font-size: 0.95rem;">Mostra questo codice al lettore ottico</p>
        </div>
        
        <div class="barcode-box">
            <svg id="barcode"></svg>
        </div>

        <button class="close-full" onclick="closeFullscreen()">Chiudi</button>
    </div>

    <script>
        let passes = JSON.parse(localStorage.getItem('smart_passes_gps')) || JSON.parse(localStorage.getItem('smart_passes')) || [];
        let codeReader = null;

        function render() {
            const list = document.getElementById('cardsList');
            const empty = document.getElementById('emptyState');
            list.innerHTML = '';
            
            if (passes.length === 0) {
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            passes.forEach(p => {
                const card = document.createElement('div');
                card.className = 'pass-card';
                const mapsSearchUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}`;

                card.innerHTML = `
                    <div class="pass-info" onclick="openFullscreen('${p.name}', '${p.code}')" style="flex:1;">
                        <h3>${p.name}</h3>
                        <p>${p.code}</p>
                        <div class="card-actions-row">
                            <a class="btn-mini-maps" href="${mapsSearchUrl}" target="_blank" onclick="event.stopPropagation()">🗺️ Cerca su Maps</a>
                        </div>
                    </div>
                    <div>
                        <button class="btn-delete" onclick="deletePass(${p.id}, event)" title="Elimina">🗑️</button>
                    </div>
                `;
                list.appendChild(card);
            });
            
            localStorage.setItem('smart_passes_gps', JSON.stringify(passes));
            localStorage.setItem('smart_passes', JSON.stringify(passes));
        }

        function openModal() {
            document.getElementById('passName').value = '';
            document.getElementById('passCode').value = '';
            document.getElementById('cardModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('cardModal').style.display = 'none';
        }

        function startCameraScanner() {
            document.getElementById('scannerModal').style.display = 'flex';
            codeReader = new ZXing.BrowserMultiFormatReader();
            
            codeReader.decodeFromVideoDevice(undefined, 'cameraPreview', (result, err) => {
                if (result) {
                    document.getElementById('passCode').value = result.text;
                    stopCameraScanner();
                }
            }).catch(err => {
                alert("Impossibile accedere alla fotocamera. Controlla i permessi del browser.");
                stopCameraScanner();
            });
        }

        function stopCameraScanner() {
            if (codeReader) {
                codeReader.reset();
            }
            document.getElementById('scannerModal').style.display = 'none';
        }

        function savePass() {
            const name = document.getElementById('passName').value.trim();
            const code = document.getElementById('passCode').value.trim();
            if(!name || !code) {
                alert('Inserisci sia il nome che il codice!');
                return;
            }
            passes.push({ id: Date.now(), name, code });
            closeModal();
            render();
        }

        function deletePass(id, event) {
            event.stopPropagation();
            if(confirm('Vuoi eliminare questa tessera?')) {
                passes = passes.filter(p => p.id !== id);
                render();
            }
        }

        function openFullscreen(name, code) {
            document.getElementById('fullTitle').innerText = name;
            document.getElementById('fullscreenView').style.display = 'flex';
            
            try {
                JsBarcode("#barcode", code, {
                    format: "CODE128",
                    lineColor: "#000000",
                    width: 2.5,
                    height: 120,
                    displayValue: true,
                    fontSize: 20,
                    margin: 10,
                    background: "#ffffff"
                });
            } catch(e) {
                alert("Codice non valido per la generazione del codice a barre.");
            }
        }

        function closeFullscreen() {
            document.getElementById('fullscreenView').style.display = 'none';
        }

        render();
    </script>
</body>
</html>
