<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartPass - Tessere Rapide</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --danger-color: #f43f5e;
            --radius: 16px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 480px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        h1 { font-size: 1.5rem; font-weight: 700; color: var(--accent-color); }
        .btn-add { background: var(--accent-color); color: #0f172a; border: none; padding: 10px 16px; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 0.95rem; }
        .cards-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        .pass-card { background: var(--card-bg); padding: 16px 20px; border-radius: var(--radius); display: flex; justify-content: space-between; align-items: center; cursor: pointer; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); transition: transform 0.1s ease; border-left: 6px solid var(--accent-color); }
        .pass-card:active { transform: scale(0.98); }
        .pass-info h3 { font-size: 1.1rem; margin-bottom: 4px; }
        .pass-info p { font-size: 0.85rem; color: #94a3b8; }
        .pass-action { font-size: 1.2rem; color: var(--accent-color); }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; padding: 20px; z-index: 100; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 400px; padding: 24px; border-radius: var(--radius); display: flex; flex-direction: column; gap: 16px; }
        .modal-content h2 { font-size: 1.2rem; }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 8px; }
        .btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; }
        .btn-save { background: var(--accent-color); color: #0f172a; }
        .btn-cancel { background: #475569; color: white; }
        .btn-delete { background: var(--danger-color); color: white; }

        /* Fullscreen Barcode View */
        .fullscreen-view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; color: black; z-index: 200; flex-direction: column; justify-content: space-between; align-items: center; padding: 40px 20px; text-align: center; }
        .fullscreen-view h2 { font-size: 2rem; margin-bottom: 10px; }
        .barcode-container { background: #f8fafc; padding: 20px; border-radius: 12px; border: 2px dashed #cbd5e1; width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; }
        .barcode-sim { font-family: monospace; font-size: 1.8rem; letter-spacing: 4px; font-weight: bold; word-break: break-all; }
        .close-full { background: #0f172a; color: white; border: none; width: 100%; max-width: 300px; padding: 16px; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .empty-state { text-align: center; color: #64748b; margin-top: 40px; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SmartPass</h1>
            <button class="btn-add" onclick="openModal()">+ Nuova Tessera</button>
        </header>

        <div id="cardsList" class="cards-grid"></div>
        <div id="emptyState" class="empty-state" style="display: none;">Nessuna tessera salvata.<br>Tocca "+ Nuova Tessera" per iniziare.</div>
    </div>

    <!-- Modal Aggiunta -->
    <div id="cardModal" class="modal">
        <div class="modal-content">
            <h2>Aggiungi Tessera</h2>
            <input type="text" id="passName" placeholder="Nome Negozio / Tessera (es. Conad)">
            <input type="text" id="passCode" placeholder="Codice a barre (numeri)">
            <div class="modal-buttons">
                <button class="btn btn-cancel" onclick="closeModal()">Annulla</button>
                <button class="btn btn-save" onclick="savePass()">Salva</button>
            </div>
        </div>
    </div>

    <!-- Vista Schermo Intero per la Cassa -->
    <div id="fullscreenView" class="fullscreen-view">
        <div>
            <h2 id="fullTitle">Negozio</h2>
            <p style="color: #64748b; font-size: 0.9rem;">Mostra questo codice alla cassa</p>
        </div>
        <div class="barcode-container">
            <div style="font-size: 3rem;">📊</div>
            <div id="fullCode" class="barcode-sim">123456789</div>
        </div>
        <button class="close-full" onclick="closeFullscreen()">Chiudi</button>
    </div>

    <script>
        let passes = JSON.parse(localStorage.getItem('smart_passes')) || [
            { id: 1, name: "Supermercato", code: "89345019283" },
            { id: 2, name: "Palestra", code: "GYM-99281-X" }
        ];

        function render() {
            const list = document.getElementById('cardsList');
            const empty = document.getElementById('emptyState');
            list.innerHTML = '';
            
            if (passes.length === 0) {
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            passes.forEach(p => {
                const card = document.createElement('div');
                card.className = 'pass-card';
                card.innerHTML = `
                    <div class="pass-info" onclick="openFullscreen('${p.name}', '${p.code}')">
                        <h3>${p.name}</h3>
                        <p>${p.code}</p>
                    </div>
                    <div>
                        <button onclick="deletePass(${p.id})" style="background:none; border:none; color:#f43f5e; cursor:pointer; font-size:1.1rem; padding: 5px;">🗑️</button>
                    </div>
                `;
                list.appendChild(card);
            });
            localStorage.setItem('smart_passes', JSON.stringify(passes));
        }

        function openModal() {
            document.getElementById('passName').value = '';
            document.getElementById('passCode').value = '';
            document.getElementById('cardModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('cardModal').style.display = 'none';
        }

        function savePass() {
            const name = document.getElementById('passName').value.trim();
            const code = document.getElementById('passCode').value.trim();
            if(!name || !code) {
                alert('Inserisci sia il nome che il codice!');
                return;
            }
            passes.push({ id: Date.now(), name, code });
            closeModal();
            render();
        }

        function deletePass(id) {
            if(confirm('Vuoi eliminare questa tessera?')) {
                passes = passes.filter(p => p.id !== id);
                render();
            }
        }

        function openFullscreen(name, code) {
            document.getElementById('fullTitle').innerText = name;
            document.getElementById('fullCode').innerText = code;
            document.getElementById('fullscreenView').style.display = 'flex';
            // Tenta di alzare la luminosità se supportata dal browser mobile
            window.scrollTo(0,0);
        }

        function closeFullscreen() {
            document.getElementById('fullscreenView').style.display = 'none';
        }

        render();
    </script>
</body>
</html>
